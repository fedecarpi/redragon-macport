name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build release
        run: swift build -c release

      - name: Package .app (smoke)
        env:
          VERSION: "0.0.0-ci"
          ARCH_LABEL: host
        run: ./scripts/package-app.sh
