name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 0.1.0). Builds and publishes a GitHub Release."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & publish macOS app
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ github.event.inputs.version }}"
            VER="${VER#v}"
          else
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid version: $VER (expected semver like 0.1.0)" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VER tag=v$VER"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build universal .app + zip
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARCH_LABEL: universal
        run: ./scripts/package-app.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: K589Config-${{ steps.meta.outputs.version }}-macos
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: K589Config ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
